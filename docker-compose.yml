services:
  mysql:
    image: mysql:8.0
    container_name: ecom_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_dev}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecom_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecom_pass_dev}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-lock-wait-timeout=10
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [ecom_net]

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [ecom_net]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecom-inventory-api
    container_name: ecom_api
    restart: unless-stopped
    # Inside the compose network we talk to the service names, not localhost,
    # and use the in-container MySQL port 3306. All values are read from .env.
    environment:
      FLASK_ENV: production
      PORT: "5000"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecom_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecom_pass_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_dev}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      CACHE_TTL_SECONDS: "60"
      DEFAULT_PAGE_SIZE: "20"
      MAX_PAGE_SIZE: "100"
      LOG_LEVEL: "INFO"
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks: [ecom_net]

volumes:
  mysql_data:
  redis_data:

networks:
  ecom_net:
    driver: bridge
